<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#1e1b4b"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  
  <!-- Cross Connections -->
  <line x1="9" y1="9" x2="23" y2="23" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="23" x2="23" y2="9" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="9" x2="16" y2="23" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Key Matrix Nodes -->
  <circle cx="9" cy="9" r="1.5" fill="#ffffff"/>
  <circle cx="23" cy="9" r="1.5" fill="#ffffff"/>
  <circle cx="16" cy="16" r="2" fill="#60a5fa"/>
  <circle cx="9" cy="23" r="1.5" fill="#ffffff"/>
  <circle cx="23" cy="23" r="1.5" fill="#ffffff"/>
</svg>
