<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нумерология — Психоматрица</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/psychomatrix.css" />
    <link rel="stylesheet" href="../css/matrix.css" />
  </head>
  <body data-theme="dark">
    <header>
      <div class="header-inner">
        <div class="brand">Нумерология</div>
        <nav class="nav-links">
          <a class="nav-link" href="index.html">Начало</a>
          <a class="nav-link" href="single-calculator.html">Една дата</a>
          <a class="nav-link" href="month-calculator.html">Месец</a>
          <a class="nav-link" href="psychomatrix.html">Психоматрица</a>
          <button class="theme-toggle" id="theme-toggle" type="button">
            Превключи тема
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="page">
        <section class="hero">
          <h1>Четири части — една финална карта</h1>
          <p>
            Изберете дата за всяка част, след което вижте как се образува общата
            схема. Припокриванията и комбинациите се маркират визуално.
          </p>
        </section>

        <section class="panel-grid">
          <div class="wheel-card">
            <div class="wheel" id="wheel"></div>
          </div>
          <div class="summary-card">
            <div class="chip-row">
              <button class="button" id="build-composite" type="button">
                Покажи финалната схема
              </button>
              <button class="secondary-button" id="reset-wheel" type="button">
                Нулирай
              </button>
            </div>
            <div id="wheel-summary" class="empty-state">
              Запълнете всички четири сегмента.
            </div>
            <div id="wheel-details" class="result-list"></div>
            <div id="composite-matrix" style="margin-top: 1rem"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="../js/numerologyEngine.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/psychomatrixPage.js"></script>
  </body>
</html>
