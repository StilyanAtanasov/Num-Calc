<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нумерология — Месец</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body data-theme="dark">
    <header>
      <div class="header-inner">
        <div class="brand">Нумерология</div>
        <nav class="nav-links">
          <a class="nav-link" href="index.html">Начало</a>
          <a class="nav-link" href="single-calculator.html">Една дата</a>
          <a class="nav-link" href="month-calculator.html">Месец</a>
          <a class="nav-link" href="psychomatrix.html">Психоматрица</a>
          <button class="theme-toggle" id="theme-toggle" type="button">
            Превключи тема
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="page">
        <section class="hero">
          <h1>Изчисляване за целия месец</h1>
          <p>
            Изберете месец и вижте всички дати в него като отделни нумерологични
            профили.
          </p>
        </section>

        <section class="panel-grid vertical-panel">
          <div class="controls">
            <label>
              Месец
              <input id="month-input" type="month" />
            </label>
            <div class="chip-row">
              <button class="button" id="calculate-month" type="button">
                Покажи месец
              </button>
              <button class="secondary-button" id="clear-month" type="button">
                Изчисти
              </button>
            </div>
          </div>

          <div class="month-card">
            <div id="month-summary" class="empty-state">
              Изберете месец, за да започнете.
            </div>
            <div id="month-results" class="month-grid"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="../js/numerologyEngine.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/monthCalculatorPage.js"></script>
  </body>
</html>
